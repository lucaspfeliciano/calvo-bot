server:
  # Render injeta PORT automaticamente; cai pra 2333 em dev local.
  port: ${PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

# Per-plugin configs ficam aqui na raiz. Cada plugin lê do seu próprio nó.
plugins:
  youtube:
    enabled: true
    # Com OAuth ligado, qualquer client funciona — usamos uma lista ampla pro fallback.
    clients: ["MUSIC", "WEB", "WEBEMBEDDED", "ANDROID_MUSIC", "ANDROID_VR"]
    # OAuth: autentica com uma conta YouTube (USE UMA CONTA SECUNDÁRIA — há risco de ban).
    # Primeiro deploy: deixa YOUTUBE_REFRESH_TOKEN vazio, o Lavalink imprime um device code no log.
    # Acesse youtube.com/activate, cole o código, complete o login. O refreshToken aparece no log;
    # cola ele na env var YOUTUBE_REFRESH_TOKEN e redeploya.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false  # Usa o youtube-plugin acima
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "BR"
      playlistLoadLimit: 6
      albumLoadLimit: 6

lavalink:
  # Lista de plugins a baixar/carregar
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    sources:
      # Fontes nativas do Lavalink. Spotify vem do lavasrc; YouTube vem do youtube-plugin.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
