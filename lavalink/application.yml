server:
  # Render injeta PORT automaticamente; cai pra 2333 em dev local.
  port: ${PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

# Per-plugin configs ficam aqui na raiz. Cada plugin lê do seu próprio nó.
plugins:
  youtube:
    enabled: true
    # Múltiplos clients aumentam a chance de pegar stream URL antes do anti-bot bater.
    clients: ["MUSIC", "ANDROID_VR", "WEB", "WEBEMBEDDED"]
    # Define um PO Token quando você tiver. Sem ele, o WEB client falha em muitos vídeos.
    # pot:
    #   token: "..."
    #   visitorData: "..."
    # OAuth (alternativa a cookies):
    # oauth:
    #   enabled: true
    #   refreshToken: "..."
  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false  # Usa o youtube-plugin acima
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "BR"
      playlistLoadLimit: 6
      albumLoadLimit: 6

lavalink:
  # Lista de plugins a baixar/carregar
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.6"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.7.5"
      snapshot: false

  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    sources:
      # Fontes nativas do Lavalink. Spotify vem do lavasrc; YouTube vem do youtube-plugin.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
